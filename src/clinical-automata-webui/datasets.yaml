# Dataset showcase manifest.
# `key` MUST match the keys in ../clinical-automata-backend/prepare.py.
# Real filesystem paths are NOT here — they stay server-side in prepare.py.
#
# We deliberately do NOT predefine tasks (that would prime the clinician).
# Instead we state what annotations the dataset provides and which label
# categories those annotations cover (no class distribution).
#
# Localization (`i18n`): clinicians know disease and organ names in their own
# working language, so display_name / modality / annotations / label_categories
# / description are translated per language. NEVER translated, in any language:
#   * `dataset`    — the dataset's own name (ISIC 2019, PAX-ray++, …)
#   * `license`    — a legal identifier (CC BY-NC, …)
#   * `source_url`
# A field missing from an i18n block falls back to the English value above it.

- key: "dermoscopy"
  display_name: "Dermoscopy — skin lesions"
  dataset: "ISIC 2019"
  modality: "Dermoscopic image"
  num_images: 25331
  annotations:
    - "Image-level diagnosis label (one class per image)"
  label_categories:
    - "Melanoma (MEL)"
    - "Melanocytic nevus (NV)"
    - "Basal cell carcinoma (BCC)"
    - "Actinic keratosis (AK)"
    - "Benign keratosis (BKL)"
    - "Dermatofibroma (DF)"
    - "Vascular lesion (VASC)"
    - "Squamous cell carcinoma (SCC)"
  license: "CC BY-NC"
  source_url: "https://challenge.isic-archive.com/data/"
  description: >
    Dermoscopy images from the International Skin Imaging Collaboration, each
    labelled with a single diagnostic category.
  i18n:
    de:
      display_name: "Dermatoskopie — Hautläsionen"
      modality: "Dermatoskopisches Bild"
      annotations:
        - "Diagnose-Label auf Bildebene (eine Klasse pro Bild)"
      label_categories:
        - "Melanom (MEL)"
        - "Melanozytärer Nävus (NV)"
        - "Basalzellkarzinom (BCC)"
        - "Aktinische Keratose (AK)"
        - "Benigne Keratose (BKL)"
        - "Dermatofibrom (DF)"
        - "Vaskuläre Läsion (VASC)"
        - "Plattenepithelkarzinom (SCC)"
      description: >
        Dermatoskopische Aufnahmen der International Skin Imaging Collaboration,
        jeweils mit genau einer diagnostischen Kategorie gelabelt.
    ja:
      display_name: "ダーモスコピー — 皮膚病変"
      modality: "ダーモスコピー画像"
      annotations:
        - "画像単位の診断ラベル（1画像につき1クラス）"
      label_categories:
        - "悪性黒色腫（メラノーマ, MEL）"
        - "色素性母斑（NV）"
        - "基底細胞癌（BCC）"
        - "日光角化症（AK）"
        - "良性角化症（BKL）"
        - "皮膚線維腫（DF）"
        - "血管性病変（VASC）"
        - "有棘細胞癌（SCC）"
      description: >
        International Skin Imaging Collaboration によるダーモスコピー画像。
        各画像に単一の診断カテゴリが付与されています。
    zh:
      display_name: "皮肤镜 — 皮肤病变"
      modality: "皮肤镜图像"
      annotations:
        - "图像级诊断标签（每张图像一个类别）"
      label_categories:
        - "黑色素瘤（MEL）"
        - "色素痣（NV）"
        - "基底细胞癌（BCC）"
        - "光化性角化病（AK）"
        - "良性角化病（BKL）"
        - "皮肤纤维瘤（DF）"
        - "血管性病变（VASC）"
        - "鳞状细胞癌（SCC）"
      description: >
        来自 International Skin Imaging Collaboration 的皮肤镜图像，
        每张图像标注一个诊断类别。

