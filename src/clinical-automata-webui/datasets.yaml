- key: "pelvic ct (fracture)"
  internal: true   # challenge data under CC BY-NC; withheld from the public demo
  display_name: "Pelvic CT — bone fragments"
  dataset: "PENGWIN 2026"
  modality: "Pelvic / femoral CT (3D volume)"
  num_images: 340
  annotations:
    - "Instance-level segmentation mask for every individual bone fragment (the label value also records which bone the fragment broke off from)"
    - "One interaction point per fragment, provided in four different sampling styles for each scan"
    - "3D surface meshes of the broken pelvis, each fragment paired with the rigid movement that returns it to its anatomically correct position"
    - "A further collection of simulated fracture patterns generated on 480 intact pelvic CT scans"
  label_categories:
    - "Sacrum"
    - "Left hipbone"
    - "Right hipbone"
    - "Left femur"
    - "Right femur"
  license: "CC BY-NC 4.0"
  source_url: "https://pengwin2026.grand-challenge.org/"
  description: >
    Three-dimensional CT scans of patients scheduled for pelvic or femoral
    fracture surgery. Each broken bone is annotated as several separate pieces
    rather than as one structure, so the individual fragments can be told apart
    and counted. A companion collection of surface meshes additionally records
    where every fragment belongs once the bone is reassembled.
  i18n:
    de:
      display_name: "Becken-CT — Knochenfragmente"
      modality: "Becken-/Femur-CT (3D-Volumen)"
      annotations:
        - "Instanzgenaue Segmentierungsmaske für jedes einzelne Knochenfragment (der Labelwert hält zusätzlich fest, von welchem Knochen das Fragment stammt)"
        - "Ein Interaktionspunkt pro Fragment, je Aufnahme in vier verschiedenen Setzvarianten"
        - "3D-Oberflächennetze des gebrochenen Beckens, jedes Fragment mit der starren Bewegung, die es in seine anatomisch korrekte Lage zurückführt"
        - "Zusätzlich eine Sammlung simulierter Frakturmuster, erzeugt auf 480 intakten Becken-CTs"
      label_categories:
        - "Kreuzbein (Sakrum)"
        - "Linkes Hüftbein"
        - "Rechtes Hüftbein"
        - "Linker Femur"
        - "Rechter Femur"
      description: >
        Dreidimensionale CT-Aufnahmen von Patientinnen und Patienten vor einer
        Becken- oder Femurfraktur-Operation. Jeder gebrochene Knochen ist nicht
        als eine Struktur, sondern als mehrere einzelne Bruchstücke annotiert,
        sodass sich die Fragmente unterscheiden und zählen lassen. Eine
        begleitende Sammlung von Oberflächennetzen hält zusätzlich fest, wohin
        jedes Fragment nach der Reposition gehört.
    ja:
      display_name: "骨盤CT — 骨片"
      modality: "骨盤・大腿骨CT（3Dボリューム）"
      annotations:
        - "個々の骨片ごとのインスタンス単位セグメンテーションマスク（ラベル値はその骨片がどの骨に由来するかも保持）"
        - "骨片ごとに1点の指示点。1つの撮影につき4通りの置き方が提供されます"
        - "骨折した骨盤の3D表面メッシュ。各骨片には、解剖学的に正しい位置へ戻すための剛体移動が付随します"
        - "さらに、480例の骨折のない骨盤CTから生成したシミュレーション骨折パターン一式"
      label_categories:
        - "仙骨"
        - "左寛骨"
        - "右寛骨"
        - "左大腿骨"
        - "右大腿骨"
      description: >
        骨盤または大腿骨の骨折手術を予定する患者の3次元CT画像です。折れた骨は
        1つの構造としてではなく複数の骨片として個別に注釈されており、各骨片を
        区別して数えることができます。付随する表面メッシュ集には、整復後に各
        骨片が収まるべき位置も記録されています。
    zh:
      display_name: "骨盆 CT — 骨折碎片"
      modality: "骨盆 / 股骨 CT(三维体数据)"
      annotations:
        - "每一块骨折碎片各自一个实例分割掩膜(标签取值同时记录该碎片来自哪块骨)"
        - "每块碎片一个交互点击点,同一次扫描提供四种不同的取点方式"
        - "骨折骨盆的三维表面网格,每块碎片附带一个把它送回解剖复位位置的刚体变换"
        - "另有一批在 480 例未骨折骨盆 CT 上生成的仿真骨折样式"
      label_categories:
        - "骶骨"
        - "左髋骨"
        - "右髋骨"
        - "左股骨"
        - "右股骨"
      description: >
        待行骨盆或股骨骨折手术患者的三维 CT 影像。断裂的骨骼不是作为一个整体
        标注,而是逐块碎片分别标注,因而可以区分和计数每一块碎片。配套的表面
        网格集合还记录了复位之后每块碎片应处的位置。
